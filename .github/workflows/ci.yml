# CI for syncai_robot_state.
#
# The package can only be compiled against ROS 2 Humble plus the ros2_rust underlay, so the
# `check` job builds the repo's own Dev Container image (.devcontainer/Dockerfile) with buildx and
# runs the same four commands CLAUDE.md lists inside it. The image layers are kept in the GitHub
# Actions cache: the first run compiles rclrs from source (slow), later runs reuse it until the
# Dockerfile changes or the cache entry is evicted.
#
# `fmt` runs on the bare runner: rustfmt needs no ROS, so it answers in well under a minute.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The same toolchain the Dockerfile installs (ARG RUST_VERSION), so rustfmt agrees with the
      # one developers run inside the container.
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - run: cargo fmt --check

  check:
    name: colcon build / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The same layout as the Dev Container: a colcon workspace with this repo at
      # src/syncai_robot_state and syncai_common vcs-imported next to it.
      - uses: actions/checkout@v4
        with:
          path: src/syncai_robot_state

      - uses: docker/setup-buildx-action@v3

      - name: Build the Dev Container image
        uses: docker/build-push-action@v6
        with:
          context: src/syncai_robot_state/.devcontainer
          build-args: |
            ROS_DISTRO=humble
            INSTALL_CLAUDE_CODE=false
          load: true
          tags: syncai-robot-state-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restore the cargo registry
        uses: actions/cache@v4
        with:
          path: cargo-registry
          key: cargo-registry-${{ hashFiles('src/syncai_robot_state/Cargo.lock') }}
          restore-keys: cargo-registry-

      # The image runs as `ros` (uid 1000) and the runner as uid 1001; the container has to be
      # able to write build/ install/ log/ into the bind-mounted workspace.
      - name: Hand the workspace to the container user
        run: |
          mkdir -p cargo-registry
          sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"

      # ROS_DOMAIN_ID=77 so a test that initialises rcl can never join a real graph (the runner
      # has none, but the habit is the point). RMW_IMPLEMENTATION matches devcontainer.json.
      - name: Build, lint and test inside the container
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$GITHUB_WORKSPACE/cargo-registry:/home/ros/.cargo/registry" \
            --env ROS_DOMAIN_ID=77 \
            --env RMW_IMPLEMENTATION=rmw_cyclonedds_cpp \
            syncai-robot-state-ci:latest \
            bash /workspace/src/syncai_robot_state/.github/scripts/ci.sh

      # Give the files back so the checkout and cache post-steps can clean up and save.
      - name: Hand the workspace back to the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
