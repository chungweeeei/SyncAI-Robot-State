# Parameters for the syncai_robot_state node.
#
# The key is a bare /** rather than the /**/syncai_robot_state the rclcpp version used: rclrs only
# matches a params-file key that is exactly "/**" or exactly the node's fully-qualified name
# (/<robot_id>/syncai_robot_state), with NO wildcard expansion, so /**/syncai_robot_state silently
# matches nothing and every value below falls back to its code default — which for publish_rate
# means 10 Hz instead of the 1 Hz intended here. /** is safe because this file is only ever passed
# to this one node (see launch/robot_state.launch.py).
/**:
  ros__parameters:
    # robot_id and base_frame are overridden by the launch file with the [system] robot_id from
    # config/system.ini; the values below are only fallbacks when the node is run without it.
    robot_id: "default_robot"
    # Map name stamped into RobotState.map. Usually overridden from the launch file, which takes
    # [map] map from the INI — and that is a map YAML *path*, not a name.
    map: "dp2f_full"
    # TF frames used for the position lookup (global_frame -> base_frame). TF frame names are not
    # namespaced by ROS: global_frame stays "map" and base_frame gets the <robot_id>/ prefix at
    # launch, which is how robots sharing one /tf are kept apart.
    global_frame: "map"
    base_frame: "base_link"
    # TF lookup tolerance in seconds.
    #
    # Carried for parity with the C++ version, where it has no effect either: the lookup is gated
    # by a non-blocking canTransform() and runs at the latest available time, so the tolerance only
    # ever applied to a race between the two calls. This port looks up in its own in-memory buffer,
    # where that race does not exist. In particular it does NOT expire a stale transform — see the
    # note at the top of src/robot_state_node/tf.rs.
    transform_tolerance: 0.1
    # Publish rate for robot_state, in Hz. The code default is 10.0; this was lowered to 1 Hz
    # because the readers are operators watching joint temperatures or chasing a localization
    # dropout, and a once-a-second status aggregate is plenty for that — anything needing
    # sub-second data (the backend's telemetry WebSocket) subscribes motor_states / odom directly.
    # Raising it does not make the message more orderable either: RobotState.timestamp has
    # whole-second resolution, so above 1 Hz consecutive messages simply repeat it.
    publish_rate: 1.0
    # How often to poll sys_manager's get_mode for RobotState.mode, in Hz. Kept slow on purpose:
    # every call spawns `byobu has-session` subprocesses in sys_manager, and the mode only changes
    # over a tens-of-seconds switch.
    mode_poll_rate: 1.0
    # Low-battery hysteresis, in percent (0-100), driving state = WARNING.
    #
    # 20% is the number already used elsewhere for the same condition: the unwired "soc < 20%"
    # safety TODO in syncai_driver_manager, the reference GaitMPC bridge that acts on it, and the
    # frontend status strip's battery colour. This node is where the judgement now lives — but it
    # only reports, it does not lie the robot down.
    #
    # The two values must differ: entering at 20% and only clearing above 25% stops a pack sitting
    # on the threshold from flipping the state on every publish. A clear value <= the warn value is
    # rejected at startup and both fall back to 20/25.
    low_battery_warn_percentage: 20.0
    low_battery_clear_percentage: 25.0
